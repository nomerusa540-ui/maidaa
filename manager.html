<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEECE6">
<meta name="robots" content="noindex,nofollow">
<title>Maida | Boshqaruv paneli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23A98521'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Georgia,serif' text-anchor='middle' fill='%23FFFDF8'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--f-head:"Cormorant Garamond",Georgia,serif;--f-body:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --bg:#EEECE6;--paper:#fff;--ink:#1A1A1A;--muted:#54544E;--gold:#A38630;--gold-deep:#86691F;--line:rgba(108,80,10,.35);--ok:#2F7A46;--warn:#B8741A;--bad:#C0503E;--sel:var(--gold-deep);--sel-ink:#fff;--card:#fff;--t1:#E4E1D6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:10;background:rgba(238,236,230,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(0.625rem + env(safe-area-inset-top,0px)) 0.5rem 0}
.bar-in{max-width:60rem;margin:0 auto}
.bar-top{display:flex;align-items:center;gap:0.5rem;padding:0 0.5rem}
.bar h1{font-family:var(--f-head);font-weight:700;font-size:1.625rem;line-height:1.1}
.role{flex:1;font-size:0.8125rem;color:var(--muted)}.role b{display:inline-block;padding:0.125rem 0.625rem;border-radius:6.1875rem;background:var(--gold-deep);color:#fff;font-size:0.75rem;letter-spacing:.05em;text-transform:uppercase;margin-right:0.375rem}
.ib{min-width:2.75rem;height:2.75rem;padding:0 0.75rem;border-radius:6.1875rem;border:1px solid var(--line);background:var(--paper);font-size:0.875rem;font-weight:500}
.tabs{display:flex;margin-top:0.375rem}
.tab{flex:1;padding:0.625rem 0.125rem 0.75rem;font-family:var(--f-head);font-weight:700;font-size:1.25rem;color:var(--muted);border-bottom:3px solid transparent;text-align:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:60rem;margin:0 auto;padding:1rem}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem;margin-bottom:1rem}
.sum div{background:var(--paper);border:1px solid var(--line);border-radius:0.75rem;padding:0.5rem 0.25rem;text-align:center;font-size:0.6875rem;color:var(--muted);line-height:1.2}
.sum b{display:block;font-family:var(--f-head);font-size:1.5rem;color:var(--ink)}
.sum .r b{color:var(--bad)}.sum .a b{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:0.5rem}
.t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:5.25rem;padding:0.375rem 0.25rem;border-radius:0.875rem;border:1.5px solid var(--line);background:var(--paper);text-align:center;overflow:hidden}
.t b{font-family:var(--f-head);font-size:1.75rem;line-height:1}
.t small{display:block;max-width:100%;font-size:0.6875rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t em{font-style:normal;font-size:0.75rem;font-weight:600;color:var(--gold-deep)}
.t.none{opacity:.55}
.t.new{background:#FDE9E5;border-color:var(--bad)}.t.accepted{background:#FFF1D9;border-color:var(--warn)}.t.served{background:#E4F2E8;border-color:var(--ok)}
.t .bell{position:absolute;top:0.125rem;right:0.25rem;font-size:0.9375rem;animation:rg 1s infinite}
@keyframes rg{50%{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){.t .bell{animation:none}}
.leg{display:flex;flex-wrap:wrap;gap:0.75rem;font-size:0.75rem;color:var(--muted);margin-top:0.875rem}
.leg i{display:inline-block;width:0.75rem;height:0.75rem;border-radius:50%;margin-right:0.25rem;vertical-align:-1px}
.w{background:var(--paper);border:1.5px solid var(--line);border-radius:1.25rem;padding:1rem;margin-bottom:0.875rem}
.w-h{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.w-h h3{font-family:var(--f-head);font-size:1.5rem;line-height:1.1}
.pill{padding:0.125rem 0.625rem;border-radius:6.1875rem;font-size:0.75rem;font-weight:600;color:#fff;background:var(--muted);white-space:nowrap}
.pill.on{background:var(--ok)}.pill.off{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.625rem}
.chip{padding:0.25rem 0.625rem;border-radius:6.1875rem;font-size:0.8125rem;font-weight:600;border:1px solid var(--line);background:var(--bg)}
.chip.new{background:#FDE9E5;border-color:var(--bad)}.chip.accepted{background:#FFF1D9;border-color:var(--warn)}.chip.served{background:#E4F2E8;border-color:var(--ok)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:0.25rem 0.625rem;width:100%;text-align:left;padding:0.625rem 0;border-top:1px solid rgba(108,80,10,.2);margin-top:0.25rem}
.row:first-of-type{margin-top:0.625rem}
.row .n{font-family:var(--f-head);font-weight:700;font-size:1.5rem;min-width:2.5rem}
.row .i{order:5;flex-basis:100%;padding-left:3.125rem;font-size:0.8125rem;color:var(--muted)}
.row .badge{margin-left:auto}
.row .s{font-weight:600;color:var(--gold-deep);white-space:nowrap}
.badge{display:inline-block;padding:0.125rem 0.625rem;border-radius:6.1875rem;font-size:0.6875rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--muted)}
.badge.new{background:var(--bad)}.badge.accepted{background:var(--warn)}.badge.served{background:var(--ok)}
.empty{color:var(--muted);font-size:0.875rem;padding:0.5rem 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,16,8,.6);display:flex;align-items:flex-end;justify-content:center}
.mbox{width:min(34rem,100%);max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:1.5rem 1.5rem 0 0;padding:1.25rem 1.125rem calc(1.25rem + env(safe-area-inset-bottom,0px))}
.mbox h3{font-family:var(--f-head);font-size:2rem;line-height:1.1}
.o{background:var(--paper);border:1px solid var(--line);border-radius:1rem;padding:0.75rem;margin-top:0.625rem;font-size:0.9375rem}
.o-h{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:0.8125rem}
.o ul{list-style:none;margin-top:0.375rem}.o li{padding:0.125rem 0}.o li b{color:var(--gold-deep);margin-right:0.5rem}
.note{margin-top:0.375rem;padding:0.375rem 0.5rem;border-radius:0.5rem;background:#FFF4D6;font-size:0.8125rem}
.tot{display:flex;justify-content:space-between;margin-top:0.875rem;font-weight:700;font-size:1.125rem}.tot span:last-child{color:var(--gold-deep)}
.xb{display:block;width:100%;margin-top:1rem;padding:0.85rem;border-radius:6.1875rem;border:1px solid var(--line);background:var(--paper);font-weight:600}
.demo{background:#FFF4D6;border:1px solid #E0C26A;border-radius:0.75rem;padding:0.625rem 0.875rem;font-size:0.875rem;margin-bottom:0.875rem}
.err{min-height:1.3em;margin-top:0.625rem;color:var(--bad);font-size:0.9375rem}
.login{max-width:24rem;margin:12vh auto 0;padding:1.5rem 1.25rem;background:var(--paper);border:1.5px solid var(--line);border-radius:1.5rem}
.login h2{font-family:var(--f-head);font-size:2rem;line-height:1.1;margin-bottom:0.25rem}
.login p{color:var(--muted);font-size:0.9375rem}
.login label{display:block;font-size:0.8125rem;color:var(--muted);margin:0.875rem 0 0.25rem}
.login input{width:100%;font:400 1rem var(--f-body);padding:0.75rem 0.8rem;border:1px solid var(--line);border-radius:0.75rem;background:#fff}
.b{width:100%;min-height:3.25rem;margin-top:1.125rem;border-radius:6.1875rem;font-weight:600;font-size:1.0625rem;color:#fff;background:var(--gold-deep)}
@media (max-width:420px){.sum{grid-template-columns:repeat(3,1fr)}}
.adm-box{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:1.25rem;padding:1.25rem}
.adm-box h4:first-child{margin-top:0}
.adm-box h4{font-family:var(--f-head);font-weight:700;font-size:1.25rem;margin:1.25rem 0 0.5rem;padding-bottom:0.25rem;border-bottom:1px solid var(--gold)}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.75rem}
.adm-box label{display:block;font-size:0.8125rem;color:var(--muted);margin:0.625rem 0 0.25rem}
.adm-box input,.adm-box select,.adm-box textarea{width:100%;font:400 1rem var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:0.625rem;padding:0.55rem 0.7rem}
.adm-box input:focus,.adm-box select:focus,.adm-box textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.adm-box input[type=file]{padding:0.4rem}
.adm-row{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem}
.adm-b{font:600 0.9375rem var(--f-body);padding:0.6rem 1rem;border-radius:6.1875rem;background:var(--sel);color:var(--sel-ink);margin-top:0.875rem}
.adm-b.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.adm-b.del{background:transparent;color:#C0503E;border:1px solid #C0503E}
.adm-acts{display:flex;flex-wrap:wrap;gap:0.5rem}
.adm-msg{font-size:0.875rem;margin-top:0.5rem;color:var(--gold-deep);min-height:1.2em}
.adm-roles{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.adm-role{text-align:left;padding:0.625rem 0.75rem;border-radius:0.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.adm-role b{display:block;font-family:var(--f-head);font-size:1.125rem}
.adm-role small{display:block;margin-top:0.125rem;font-size:0.75rem;line-height:1.3;color:var(--muted)}
.adm-role[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.adm-role[aria-pressed="true"] small{color:var(--sel-ink);opacity:.85}
.adm-item{display:flex;align-items:center;gap:0.625rem;padding:0.5rem 0;border-bottom:1px solid var(--line)}
.adm-item img,.adm-item .ph{flex:none;width:2.5rem;height:2.5rem;border-radius:0.5rem;object-fit:cover;display:grid;place-items:center;background:var(--t1)}
.adm-item .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.adm-item .nm small{display:block;color:var(--muted)}
.adm-item button{font-size:0.8125rem;padding:0.35rem 0.7rem;border-radius:6.1875rem;border:1px solid var(--line)}
.adm-cat{margin-top:0.75rem;font-family:var(--f-head);font-weight:700;color:var(--gold-deep)}
.adm-prev{max-width:8rem;max-height:8rem;border-radius:0.625rem;margin-top:0.5rem;display:block}
.adm-box details{margin-top:0.625rem}
.adm-box summary{cursor:pointer;color:var(--gold-deep);font-size:0.875rem}
.adm-prev[hidden],.adm-b[hidden]{display:none}
.adm-top .adm-acts{flex-wrap:nowrap}
.adm-top .adm-b{padding:0.45rem 0.8rem}
@media (max-width:420px){.adm-roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <h2>Boshqaruv paneli</h2>
  <p>Maida Restaurant. Bosh admin va managerlar uchun.</p>
  <form id="lf">
    <label for="em">Login</label><input id="em" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pw">Parol</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="b" type="submit">Kirish</button>
  </form>
</section>
<section class="login" id="gate" hidden>
  <h2 id="gt"></h2><p id="gp"></p>
  <button class="b" id="gout" type="button">Chiqish</button>
</section>
<div id="app" hidden>
  <header class="bar"><div class="bar-in">
    <div class="bar-top"><h1>Maida</h1><span class="role" id="role"></span><button class="ib" id="out" type="button">Chiqish</button></div>
    <div class="tabs" role="tablist"><button class="tab" id="tT" role="tab">Stollar</button><button class="tab" id="tW" role="tab">Afitsantlar</button><button class="tab" id="tA" role="tab" hidden>Admin</button></div>
  </div></header>
  <main>
    <div class="demo" id="demo" hidden>Demo rejim: Firebase ulanmagan. Ma'lumot shu brauzerdagi menyu va afitsant panelidan olinadi.</div>
    <div class="err" id="gerr" role="alert"></div>
    <div class="sum" id="sum"></div>
    <div id="view"></div>
    <div class="adm-box" id="admView" hidden></div>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<script src="menu.js"></script>
<script>
/* manager.html: bosh admin va managerlar uchun jonli panel (faqat ko'rish).
   FIREBASE_CONFIG boshqa fayllardagi bilan bir xil bo'lsin. */
const FIREBASE_CONFIG = { apiKey:'', authDomain:'', projectId:'', appId:'' };
const ADMIN_EMAILS = ['admin@maida.uz'];   /* firestore.rules dagi isAdmin() ro'yxati bilan bir xil bo'lsin */
const LOGIN_DOMAIN = 'maida.uz', SHIFT_HOURS = 10, TABLE_COUNT = 30, ORDER_WINDOW_H = 24, ORDER_LIMIT = 300;
const DEMO = !FIREBASE_CONFIG.apiKey;
const $ = s => document.querySelector(s);
const mk = (tag,cls,text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = p => String(Math.round(p)).replace(/\B(?=(\d{3})+(?!\d))/g,' ') + " so'm";
const p2 = n => String(n).padStart(2,'0');
const hhmm = ms => { const d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const ago = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 1 ? 'hozir' : m < 60 ? m + ' daq' : Math.floor(m / 60) + ' s ' + (m % 60) + ' d'; };
const tblSort = (a,b) => { const x = Number(a), y = Number(b); return (isNaN(x) || isNaN(y)) ? String(a).localeCompare(String(b)) : x - y; };
const ST = {new:'Yangi', accepted:'Jarayonda', served:'Berildi', none:'Bo‘sh'};
let orders = [], calls = [], tablesMap = {}, waiters = [], tab = 'tables', roleName = '', isAdmin = false, admBuilt = false, FB = null;

/* ---------- Ma'lumotni tahlil qilish ---------- */
function derive(){
  const now = Date.now(), T = {};
  orders.forEach(o => {
    if (o.open === false || ['new','accepted','served'].indexOf(o.status) < 0) return;
    const t = T[o.table] = T[o.table] || {tb:o.table, os:[], total:0, first:o.ms};
    t.os.push(o); t.total += Number(o.total) || 0; t.first = Math.min(t.first, o.ms);
  });
  Object.keys(T).forEach(k => { const t = T[k]; t.state = t.os.some(o => o.status === 'new') ? 'new' : t.os.some(o => o.status === 'accepted') ? 'accepted' : 'served'; });
  calls.forEach(c => { if (now - c.ms > 3 * 3600e3) return; const t = T[c.table] = T[c.table] || {tb:c.table, os:[], total:0, first:c.ms, state:'none'}; t.call = Math.min(t.call || 1e15, c.ms); });
  const own = {};
  Object.keys(tablesMap).forEach(k => { const o = tablesMap[k]; if (o.until > now) own[k] = o; });
  for (let i = 1; i <= TABLE_COUNT; i++) if (!T[i]) T[i] = {tb:String(i), os:[], total:0, state:'none'};
  Object.keys(T).forEach(k => { T[k].owner = own[k] || null; });
  return {T, own};
}
function shiftInfo(w){
  const st = w.shiftStart && w.shiftStart.toMillis ? w.shiftStart.toMillis() : (typeof w.shiftStart === 'number' ? w.shiftStart : 0), left = st ? st + SHIFT_HOURS * 3600e3 - Date.now() : 0;
  if (w.active === false) return {t:'Faolsiz', c:'off'};
  if (left > 0) return {t:'Smenada · ' + Math.floor(left / 3600e3) + ' s ' + p2(Math.floor(left % 3600e3 / 60000)) + ' d qoldi', c:'on'};
  return {t:'Smena yo‘q', c:''};
}

/* ---------- Chizish ---------- */
function drawSum(D){
  const act = Object.keys(D.T).filter(k => D.T[k].os.length), nw = orders.filter(o => o.open !== false && o.status === 'new').length,
    ac = orders.filter(o => o.open !== false && o.status === 'accepted').length, cl = Object.keys(D.T).filter(k => D.T[k].call).length,
    sh = waiters.filter(w => w.role !== 'manager' && shiftInfo(w).c === 'on').length;
  const box = $('#sum'); box.innerHTML = '';
  [['Ochiq stol',act.length,''],['Yangi',nw,'r'],['Jarayonda',ac,'a'],['Chaqiruv',cl,'r'],['Smenada',sh,'']].forEach(([n,v,c]) => { const d = mk('div',c,n); d.prepend(mk('b','',String(v))); box.appendChild(d); });
}
function tile(t){
  const b = mk('button','t ' + t.state); b.type = 'button'; b.appendChild(mk('b','',t.tb));
  b.appendChild(mk('small','',t.owner ? t.owner.name : (t.os.length ? 'egasiz' : '')));
  if (t.total) b.appendChild(mk('em','',fmt(t.total)));
  if (t.call){ const bl = mk('span','bell','🔔'); bl.setAttribute('aria-label','Chaqirmoqda'); b.appendChild(bl); }
  b.onclick = () => showTable(t); return b;
}
function drawTables(D){
  const v = $('#view'); v.innerHTML = '';
  const g = mk('div','grid'); Object.keys(D.T).sort(tblSort).forEach(k => g.appendChild(tile(D.T[k]))); v.appendChild(g);
  const lg = mk('div','leg'); [['#fff','Bo‘sh'],['#C0503E','Yangi buyurtma'],['#B8741A','Jarayonda'],['#2F7A46','Berildi (hisob kutilmoqda)']].forEach(([c,n]) => { const s = mk('span','',n); const i = mk('i'); i.style.background = c; i.style.border = '1px solid rgba(0,0,0,.2)'; s.prepend(i); lg.appendChild(s); }); lg.appendChild(mk('span','','🔔 afitsantni chaqirmoqda')); v.appendChild(lg);
}
function waiterCard(name, info, tbls, D){
  const w = mk('div','w'), h = mk('div','w-h'); h.appendChild(mk('h3','',name)); if (info) h.appendChild(mk('span','pill ' + info.c, info.t)); w.appendChild(h);
  const live = tbls.filter(t => t.os.length || t.call), cnt = s => live.filter(t => t.state === s).length;
  const ch = mk('div','chips'); ch.appendChild(mk('span','chip','Stollar: ' + (tbls.length ? tbls.map(t => t.tb).join(', ') : 'tanlanmagan')));
  if (cnt('new')) ch.appendChild(mk('span','chip new','Yangi: ' + cnt('new')));
  if (cnt('accepted')) ch.appendChild(mk('span','chip accepted','Jarayonda: ' + cnt('accepted')));
  if (cnt('served')) ch.appendChild(mk('span','chip served','Berildi: ' + cnt('served')));
  const cc = live.filter(t => t.call).length; if (cc) ch.appendChild(mk('span','chip new','🔔 Chaqiruv: ' + cc));
  w.appendChild(ch);
  if (!live.length) w.appendChild(mk('div','empty','Hozir faol stol yo‘q.'));
  live.sort((a,b) => tblSort(a.tb,b.tb)).forEach(t => {
    const r = mk('button','row'); r.type = 'button'; r.appendChild(mk('span','n',t.tb));
    const i = mk('span','i', (t.os.length ? t.os.length + ' buyurtma · ' + ago(t.first) : '') + (t.call ? (t.os.length ? ' · ' : '') + '🔔 ' + ago(t.call) + ' oldin chaqirgan' : ''));
    r.appendChild(i); if (t.state !== 'none') r.appendChild(mk('span','badge ' + t.state, ST[t.state])); if (t.total) r.appendChild(mk('span','s',fmt(t.total)));
    r.onclick = () => showTable(t); w.appendChild(r);
  });
  return w;
}
function drawWaiters(D){
  const v = $('#view'); v.innerHTML = '';
  let list = waiters.filter(w => w.role !== 'manager');
  if (DEMO) { const seen = {}; Object.keys(D.own).forEach(k => { const o = D.own[k]; if (!seen[o.uid]){ seen[o.uid] = 1; list.push({id:o.uid, name:o.name, shiftStart:o.until - SHIFT_HOURS * 3600e3}); } }); }
  list.sort((a,b) => String(a.name || a.login).localeCompare(String(b.name || b.login)));
  list.forEach(w => { const tbls = Object.keys(D.T).filter(k => D.T[k].owner && D.T[k].owner.uid === w.id).map(k => D.T[k]); v.appendChild(waiterCard(w.name || w.login, shiftInfo(w), tbls, D)); });
  const mineIds = {}; list.forEach(w => { mineIds[w.id] = 1; });
  const free = Object.keys(D.T).filter(k => !D.T[k].owner && (D.T[k].os.length || D.T[k].call)).map(k => D.T[k]);

async function startFirebase(){

  const [a,au,fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = a.initializeApp(FIREBASE_CONFIG), auth = au.getAuth(app), db = fs.getFirestore(app);
  let subs = [], unsubMe = null, live = false;
  FB = {a, au, fs, db, auth};
  const stop = () => { subs.forEach(f => f()); subs = []; live = false; orders = []; calls = []; tablesMap = {}; waiters = []; };
  const bad = () => { $('#gerr').textContent = 'Ma’lumotni o‘qib bo‘lmadi. firestore.rules yangilanganini va hisobingiz ruxsatini tekshiring.'; };

    if (live) return; live = true; $('#gerr').textContent = '';
    const since = fs.Timestamp.fromMillis(Date.now() - ORDER_WINDOW_H * 3600e3);
    subs.push(fs.onSnapshot(fs.query(fs.collection(db,'orders'), fs.where('createdAt','>=',since), fs.orderBy('createdAt','desc'), fs.limit(ORDER_LIMIT)),
      s => { orders = toList(s, (id,v) => Object.assign({}, v, {id, ms:tms(v.createdAt) || Date.now()})); draw(); }, bad));
    subs.push(fs.onSnapshot(fs.query(fs.collection(db,'calls'), fs.where('status','==','open'), fs.limit(100)),
      s => { calls = toList(s, (id,v) => Object.assign({}, v, {id, ms:tms(v.createdAt) || Date.now()})); draw(); }, bad));
    subs.push(fs.onSnapshot(fs.collection(db,'tables'), s => { tablesMap = {}; s.docs.forEach(d => { const v = d.data(); tablesMap[d.id] = {uid:v.uid, name:v.name || '', until:tms(v.until)}; }); draw(); }, bad));
    subs.push(fs.onSnapshot(fs.collection(db,'waiters'), s => { waiters = toList(s, (id,v) => Object.assign({}, v, {id, role:v.role || 'waiter'})); draw(); }, bad));
    showApp(role, who);
  }
  $('#lf').addEventListener('submit', async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    let em = $('#em').value.trim().toLowerCase(); if (em.indexOf('@') < 0) em += '@' + LOGIN_DOMAIN;
    try { await au.signInWithEmailAndPassword(auth, em, $('#pw').value); } catch(er){ $('#lerr').textContent = 'Login yoki parol noto‘g‘ri.'; }
  });
  const signOut = () => au.signOut(auth); $('#out').onclick = signOut; $('#gout').onclick = signOut;
  au.onAuthStateChanged(auth, u => {
    stop(); if (unsubMe){ unsubMe(); unsubMe = null; }
    if (!u){ $('#app').hidden = true; $('#gate').hidden = true; $('#login').hidden = false; return; }
    const em = (u.email || '').toLowerCase();
    if (ADMIN_EMAILS.indexOf(em) >= 0){ begin('Bosh admin', em); return; }
    unsubMe = fs.onSnapshot(fs.doc(db,'waiters',u.uid), s => {
      const w = s.exists() ? s.data() : null;
      if (!w){ stop(); gate('Hisob topilmadi','Bu hisob ro‘yxatda yo‘q. Administratorga murojaat qiling.'); }
      else if (w.active === false){ stop(); gate('Hisobingiz faol emas','Administrator hisobingizni faolsizlantirgan.'); }
      else if (w.role !== 'manager'){ stop(); gate('Bu hisob afitsant uchun','Afitsant paneli: ofitsant.html sahifasidan kiring.'); }
      else begin('Manager', w.name || em);
    }, () => gate('Ulanib bo‘lmadi','Internetni tekshirib, sahifani yangilang.'));
  });
}

const QR=(function(){

      tg.onclick=async()=>{ try{ await fs.updateDoc(fs.doc(db,'waiters',r.id), r.active===false?{active:true}:{active:false,shiftStart:null}); }catch(e){ say('O\u2018zgartirib bo\u2018lmadi.'); } };
      const dl=mk('button','','O\u2018chirish'); dl.type='button'; dl.style.color='#C0503E';
      dl.onclick=async()=>{ if(!confirm('\u201C'+(r.name||r.login)+'\u201D o\u2018chirilsinmi? U tizimga kira olmaydi.')) return;
        try{ await fs.deleteDoc(fs.doc(db,'waiters',r.id)); }catch(e){ say('O\u2018chirib bo\u2018lmadi.'); } };
      it.append(tg,dl); L.appendChild(it);
    });
  };
  vCl.push(fs.onSnapshot(fs.collection(db,'waiters'),snap=>{ rows=snap.docs.map(d=>Object.assign({id:d.id},d.data({serverTimestamps:'estimate'}))); draw(); },
    ()=>say('Ro\u2018yxatni o\u2018qib bo\u2018lmadi. firestore.rules dagi admin emailini tekshiring.')));
  const iv=setInterval(draw,30000); vCl.push(()=>clearInterval(iv));

  /* Eshik QR kodi */
  const qb=q('wqr'), base=()=>new URL('ofitsant.html',location.href).href;
  const newCode=()=>{ const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', r=new Uint8Array(24); crypto.getRandomValues(r); return [...r].map(x=>A[x%A.length]).join(''); };
  const drawQR=code=>{
    qb.innerHTML='';
    const act=mk('div','adm-acts');
    if(code){
      const url=base()+'?smena='+code, svg=QR.svg(url), h=mk('div'); h.style.cssText='width:min(14rem,100%);margin:0.5rem auto;border:1px solid var(--line);border-radius:0.5rem;overflow:hidden;background:#fff'; h.innerHTML=svg;
      qb.appendChild(h);
      const u=mk('p','adm-msg',url); u.style.cssText='overflow-wrap:anywhere;font-size:0.75rem;color:var(--muted);text-align:center'; qb.appendChild(u);
      qb.appendChild(mk('p','adm-msg','Afitsant ishga kelib shu kodni telefon kamerasi bilan skanerlasa, smena '+SH_H+' soatga ochiladi va keyin o\u2018zi yopiladi.'));
      const pr=mk('button','adm-b','Chop etish'); pr.type='button';
      pr.onclick=()=>{ const win=window.open('','_blank'); if(!win) return say('Brauzer yangi oynani blokladi.');
        win.document.write('<!doctype html><meta charset="utf-8"><title>Maida smena QR</title><style>body{font-family:Georgia,serif;text-align:center;margin:0;padding:2rem}svg{width:min(80vw,24rem);height:auto}h1{font-size:2.25rem;margin:0 0 .25rem}p{font-size:1.25rem;margin:.5rem 0}</style><h1>Maida</h1><p>Ishga kelganda skanerlang</p>'+svg+'<p style="font-size:.95rem">Smena '+SH_H+' soat davom etadi</p>');
        win.document.close(); win.focus(); setTimeout(()=>win.print(),300); };
      act.appendChild(pr);
    } else qb.appendChild(mk('p','adm-msg','QR kod hali yaratilmagan.'));
    const nb=mk('button','adm-b alt',code?'Yangi QR kod yaratish':'QR kod yaratish'); nb.type='button';
    nb.onclick=async()=>{ if(code&&!confirm('Yangi kod yaratilsa, eshikdagi eski QR ishlamay qoladi. Davom etilsinmi?')) return;
      try{ const c=newCode(); await fs.setDoc(fs.doc(db,'config','shift'),{code:c,updatedAt:fs.serverTimestamp()}); drawQR(c); }catch(e){ say('QR kodni saqlab bo\u2018lmadi.'); } };
    act.appendChild(nb); qb.appendChild(act);
  };

  /* Hisobot: har chekda ofitsant paneli kunlik yozuvni yangilaydi (reports/YYYY-MM-DD) */
  const rb=q('wrep'), fm=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so\u2018m';
  let days=[], span=30, loaded=false;
  const dk=i=>{ const d=new Date(Date.now()-i*864e5); return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); };
  const loadRep=async()=>{
    try{ const snap=await fs.getDocs(fs.query(fs.collection(db,'reports'),fs.orderBy('date','desc'),fs.limit(31)));
      days=snap.docs.map(d=>d.data()); loaded=true; drawRep(); }
    catch(e){ rb.textContent=''; say('Hisobotni o\u2018qib bo\u2018lmadi. firestore.rules yangilanganini tekshiring.'); }
  };
  const drawRep=()=>{
    rb.innerHTML='';
    const bar=mk('div','adm-acts');
    [[1,'Bugun'],[7,'7 kun'],[30,'30 kun']].forEach(([n,t])=>{ const b=mk('button','adm-b'+(span===n?'':' alt'),t); b.type='button'; b.style.marginTop='0'; b.onclick=()=>{ span=n; drawRep(); }; bar.appendChild(b); });
    const rf=mk('button','adm-b alt','Yangilash'); rf.type='button'; rf.style.marginTop='0'; rf.onclick=loadRep; bar.appendChild(rf);
    rb.appendChild(bar);
    if(!loaded){ rb.appendChild(mk('p','adm-msg','Yuklanmoqda...')); return; }
    const keys=new Set(Array.from({length:span},(_,i)=>dk(i))), rows=days.filter(d=>keys.has(d.date));
    const total=rows.reduce((s,d)=>s+(d.total||0),0), checks=rows.reduce((s,d)=>s+(d.checks||0),0);
    if(!checks){ rb.appendChild(mk('p','adm-msg','Bu davrda chek chiqarilmagan.')); return; }
    const sum=mk('div','adm-msg'); sum.style.cssText='font-size:1rem;color:var(--ink);margin-top:.75rem';
    sum.appendChild(mk('b','',fm(total))); sum.appendChild(document.createTextNode(' \u00B7 '+checks+' ta chek \u00B7 o\u2018rtacha '+fm(total/checks))); rb.appendChild(sum);
    const dish={}; rows.forEach(d=>Object.keys(d.items||{}).forEach(k=>{ const it=d.items[k], e=dish[it.n||k]||(dish[it.n||k]={q:0,s:0}); e.q+=it.q||0; e.s+=it.s||0; }));
    const top=Object.keys(dish).sort((a,b)=>dish[b].q-dish[a].q).slice(0,10);
    rb.appendChild(mk('div','adm-cat','Eng ko\u2018p sotilgan taomlar'));
    top.forEach(n=>{ const r=mk('div','adm-item'), nm=mk('div','nm',n); nm.appendChild(mk('small','',dish[n].q+' ta \u00B7 '+fm(dish[n].s))); r.appendChild(nm); rb.appendChild(r); });
    rb.appendChild(mk('div','adm-cat','Kunlar bo\u2018yicha'));
    rows.forEach(d=>{ const r=mk('div','adm-item'), nm=mk('div','nm',d.date); nm.appendChild(mk('small','',(d.checks||0)+' ta chek \u00B7 '+fm(d.total))); r.appendChild(nm); rb.appendChild(r); });
    const cv=mk('button','adm-b alt','CSV yuklab olish'); cv.type='button';
    cv.onclick=()=>{ const e=x=>'"'+String(x).replace(/"/g,'""')+'"', L=['sana,cheklar,tushum'];
      rows.forEach(d=>L.push([d.date,d.checks||0,d.total||0].join(','))); L.push('','taom,soni,summa'); top.forEach(n=>L.push([e(n),dish[n].q,dish[n].s].join(',')));
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+L.join('\n')],{type:'text/csv'})); a.download='maida-hisobot.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
    rb.appendChild(cv);
  };
  drawRep(); loadRep();
  fs.getDoc(fs.doc(db,'config','shift')).then(d=>drawQR(d.exists()?d.data().code:'')).catch(()=>{ qb.textContent=''; say('QR kodni o\u2018qib bo\u2018lmadi. Qoidalarni tekshiring.'); });
}


function resize(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
  const M=720,k=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',.84)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

function panel(b){
  b.innerHTML='<h4 id="ft">Taom qo\u2018shish</h4>'+
  '<label>Kategoriya</label><select id="cat"></select>'+
  '<label>Nomi</label><input id="n" maxlength="60">'+
  '<div class="adm-row"><div><label>Narxi (so\u2018m)</label><input id="p" type="number" min="0" step="1000" inputmode="numeric"></div><div><label>Emoji (rasm bo\u2018lmasa)</label><input id="e" maxlength="4"></div></div>'+
  '<label>Qisqa tavsif</label><input id="d" maxlength="120">'+
  '<label>Masalliqlar (vergul bilan)</label><input id="i" placeholder="Go\u2018sht, Piyoz, Sabzi">'+
  '<label>Rasm</label><input id="img" type="file" accept="image/*"><img class="adm-prev" id="pv" alt="" hidden><button class="adm-b alt" id="rmimg" type="button" hidden>Rasmni olib tashlash</button>'+
  '<details><summary>Rus va ingliz tarjimasi (ixtiyoriy)</summary><label>Nomi (RU)</label><input id="rn"><label>Tavsif (RU)</label><input id="rd"><label>Nomi (EN)</label><input id="en"><label>Tavsif (EN)</label><input id="ed"></details>'+
  '<div class="adm-msg" id="m"></div><div class="adm-acts"><button class="adm-b" id="sv" type="button">Saqlash</button><button class="adm-b alt" id="cl" type="button" hidden>Bekor qilish</button></div>'+
  '<h4>Menyu ro\u2018yxati</h4><div id="lst"></div>'+
  '<h4>Stol QR kodlari</h4><div id="tqr"></div>'+
  '<h4>Xodimlar (afitsant va manager)</h4><div id="wbox"></div>'+
  '<h4>Menyuni saqlash va qaytarish</h4>'+
  '<div class="adm-acts"><button class="adm-b alt" id="exp" type="button">Menyuni yuklab olish (JSON)</button><button class="adm-b alt" id="imp" type="button">JSON yuklash</button><button class="adm-b del" id="rst" type="button">Asl holatga qaytarish</button></div>'+
  '<input id="impf" type="file" accept="application/json" hidden><div class="adm-msg" id="m2"></div>';
  const g=id=>b.querySelector('#'+id), say=(t,id)=>{ g(id||'m').textContent=t; };
  MENU.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; g('cat').appendChild(o); });
  (function(){
    const t=g('tqr'), base=()=>new URL('index.html',location.href).href;
    t.innerHTML='<label>Stollar soni</label><input id="tn" type="number" min="1" max="200" value="'+TABLE_COUNT+'" inputmode="numeric"><p class="adm-msg" style="color:var(--muted);overflow-wrap:anywhere">Har bir stol uchun alohida QR: <span id="tu"></span></p><button class="adm-b" id="tp" type="button">Barcha stol QR kodlarini chop etish</button><div class="adm-msg" id="tm"></div>';
    const sync=()=>{ t.querySelector('#tu').textContent=base()+'?stol=1 ... ?stol='+(t.querySelector('#tn').value||TABLE_COUNT); }; sync(); t.querySelector('#tn').oninput=sync;
    t.querySelector('#tp').onclick=()=>{
      const n=Math.max(1,Math.min(200,parseInt(t.querySelector('#tn').value,10)||TABLE_COUNT)); let cells='';
      try{ for(let i=1;i<=n;i++) cells+='<div class="c"><h1>Maida</h1><h2>Stol '+i+'</h2>'+QR.svg(base()+'?stol='+i)+'<p>Menyu va afitsantni chaqirish</p></div>'; }
      catch(e){ t.querySelector('#tm').textContent='QR yaratib bo\u2018lmadi.'; return; }
      const win=window.open('','_blank'); if(!win){ t.querySelector('#tm').textContent='Brauzer yangi oynani blokladi.'; return; }
      win.document.write('<!doctype html><meta charset="utf-8"><title>Maida stol QR</title><style>@page{margin:10mm}body{font-family:Georgia,serif;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6mm}.c{text-align:center;border:1px dashed #999;padding:6mm;break-inside:avoid}h1{font-size:20pt;margin:0}h2{font-size:28pt;margin:2mm 0}svg{width:58mm;height:auto}p{font-size:11pt;margin:2mm 0 0}</style>'+cells);
      win.document.close(); win.focus(); setTimeout(()=>win.print(),400);
    };
  })();
  const setImg=d=>{ imgData=d; g('pv').hidden=!d; g('rmimg').hidden=!d; if(d) g('pv').src=d; };
  const reset=()=>{ editing=null; ['n','p','e','d','i','rn','rd','en','ed'].forEach(k=>g(k).value=''); g('img').value=''; setImg(null); g('ft').textContent='Taom qo\u2018shish'; g('sv').textContent='Saqlash'; g('cl').hidden=true; };
  g('cl').onclick=()=>{ reset(); say(''); };
  g('img').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ setImg(await resize(f)); say(''); }catch(er){ say('Rasmni o\u2018qib bo\u2018lmadi.'); } };
  g('rmimg').onclick=()=>{ g('img').value=''; setImg(null); };
  function list(){ const L=g('lst'); L.innerHTML='';
    MENU.forEach(c=>{ L.appendChild(mk('div','adm-cat',c.name));
      c.items.forEach((it,ix)=>{ const r=mk('div','adm-item');
        if(it.img){ const im=new Image(); im.src=it.img; im.alt=''; r.appendChild(im); } else r.appendChild(mk('div','ph',it.e||'\u25C7'));
        const nm=mk('div','nm',it.n); nm.appendChild(mk('small','',fmt(it.p))); r.appendChild(nm);
        const eb=mk('button','',"Tahrir"); eb.type='button'; eb.onclick=()=>edit(c.id,ix);
        const db=mk('button','',"O\u2018chirish"); db.type='button'; db.style.color='#C0503E'; db.onclick=()=>{ if(confirm('\u201C'+it.n+'\u201D o\u2018chirilsinmi?')){ c.items.splice(ix,1); done(); list(); if(editing) reset(); } };
        r.append(eb,db); L.appendChild(r); }); }); }
  function done(){ const ok=save(); say(ok?'Saqlandi.':'Brauzer xotirasi to\u2018ldi: rasmlarni kichikroq tanlang.'); }
  function edit(cid,ix){ const c=MENU.find(x=>x.id===cid), it=c.items[ix]; editing={cid,ix};
    g('cat').value=cid; g('n').value=it.n||''; g('p').value=it.p||''; g('e').value=it.e||''; g('d').value=it.d||''; g('i').value=(it.i||[]).join(', ');
    g('rn').value=it.ru?it.ru[0]:''; g('rd').value=it.ru?it.ru[1]||'':''; g('en').value=it.en?it.en[0]:''; g('ed').value=it.en?it.en[1]||'':'';
    g('img').value=''; setImg(it.img||null); g('ft').textContent='Taomni tahrirlash'; g('sv').textContent='O\u2018zgarishni saqlash'; g('cl').hidden=false; g('ft').scrollIntoView({behavior:'smooth',block:'start'}); }
  g('sv').onclick=()=>{
    const n=g('n').value.trim(), p=Math.round(Number(g('p').value));
    if(!n) return say('Nomini yozing.'); if(!(p>=0)||g('p').value==='') return say('Narxni kiriting.');
    const it={n,p,d:g('d').value.trim(),i:g('i').value.split(',').map(x=>x.trim()).filter(Boolean)};
    const e=g('e').value.trim(); if(e) it.e=e; if(imgData) it.img=imgData;
    const rn=g('rn').value.trim(), en=g('en').value.trim();
    if(rn) it.ru=[rn,g('rd').value.trim()||it.d]; if(en) it.en=[en,g('ed').value.trim()||it.d];
    const cat=MENU.find(c=>c.id===g('cat').value);
    if(editing){ const old=MENU.find(c=>c.id===editing.cid); if(old===cat) cat.items[editing.ix]=it; else { old.items.splice(editing.ix,1); cat.items.push(it); } }
    else cat.items.push(it);
    reset(); done(); list(); };
  g('exp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(MENU.map(c=>({id:c.id,items:c.items})),null,1)],{type:'application/json'})); a.download='maida-menyu.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  g('imp').onclick=()=>g('impf').click();
  g('impf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const sv=JSON.parse(r.result); if(!Array.isArray(sv)) throw 0;
    sv.forEach(x=>{ const c=MENU.find(m=>m.id===x.id); if(c&&Array.isArray(x.items)) c.items=x.items; }); save(); list(); say('Yuklandi.','m2'); }catch(er){ say('Fayl noto\u2018g\u2018ri.','m2'); } }; r.readAsText(f); };
  g('rst').onclick=()=>{ if(confirm('Barcha o\u2018zgarishlar o\u2018chib, asl menyu qaytsinmi?')){ localStorage.removeItem(LS); location.reload(); } };
  list();
  waiters(g('wbox'));
}
window.adminBuild=el=>panel(el);
window.adminReset=()=>{ wClean(); };
})();
